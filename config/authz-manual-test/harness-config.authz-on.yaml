# Manual test profile: authz ON + valid local blob
# Prefer: bash config/authz-manual-test/switch.sh on
# (switch.sh rewrites cli.* from existing config / bin/ and ensures blob)
paths:
  knowledge: wikis

cli:
  qdm_metric_cli: bin/qdm-metric-cli

authz:
  mode: on
  blob_file: config/dev-auth.blob
  # Explicit local principal for file-mode only (not a product default identity).
  dev_user_id: local-test-user
  allow_local_blob: true
