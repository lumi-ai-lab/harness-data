# Manual test profile: authz ON + valid local blob
# Paths are workspace-relative (run switch.sh from any machine under this repo).
paths:
  knowledge: wikis

cli:
  qdm_cmr_cli: /absolute/path/to/qdm-cmr-cli
  qdm_indicators_cli: /absolute/path/to/qdm-indicators-cli
  qdm_sql_cli: /absolute/path/to/qdm-sql-cli
  qdm_metric_cli: bin/qdm-metric-cli
  qdm_cas_cli: /absolute/path/to/cas-cli

authz:
  mode: on
  blob_file: config/dev-auth.blob
  # Explicit local principal for file-mode only (not a product default identity).
  dev_user_id: local-test-user
  allow_local_blob: true
