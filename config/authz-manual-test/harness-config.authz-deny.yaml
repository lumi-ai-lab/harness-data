# Manual test profile: authz ON but blob missing -> hook blocks
# Prefer: bash config/authz-manual-test/switch.sh deny
paths:
  knowledge: wikis

cli:
  qdm_metric_cli: bin/qdm-metric-cli
  qdm_sql_cli: bin/qdm-sql-cli
  qdm_cas_cli: bin/cas-cli

authz:
  mode: on
  blob_file: config/dev-auth.blob.MISSING
  dev_user_id: local-test-user
  allow_local_blob: true
