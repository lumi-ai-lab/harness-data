# Manual test profile: authz OFF (no data-auth injection)
paths:
  knowledge: wikis

cli:
  qdm_sql_cli: /absolute/path/to/qdm-sql-cli
  qdm_metric_cli: bin/qdm-metric-cli
  qdm_cas_cli: /absolute/path/to/cas-cli

authz:
  mode: off
  blob_file: config/dev-auth.blob
  dev_user_id: local-test-user
  allow_local_blob: true
