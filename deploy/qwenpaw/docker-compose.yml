services:
  qwenpaw:
    image: ${QWENPAW_IMAGE:-harness-data-qwenpaw:0.0.56-amd64}
    platform: linux/amd64
    user: "${QWENPAW_UID:-10001}:${QWENPAW_GID:-10001}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QWENPAW_PORT:-8088}:8088"
    environment:
      # 代理默认关闭:模型网关与企业微信 API 国内可直连。需要时取消注释,
      # 容器内必须用 host.docker.internal,127.0.0.1 指向容器自身。
      # http_proxy: http://host.docker.internal:1082
      # https_proxy: http://host.docker.internal:1082
      QWENPAW_MODEL_REQUIRED: "1"
      QWENPAW_MODEL_API_KEY: ${QWENPAW_MODEL_API_KEY:?set QWENPAW_MODEL_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - qwenpaw-working:/app/working
      - qwenpaw-secret:/app/working.secret
      - qwenpaw-backups:/app/working.backups
      - qdm-data:/app/qdm-data
      - ${QDM_CHANNEL_SECRET_DIR:?set QDM_CHANNEL_SECRET_DIR}:/run/secrets:ro

volumes:
  qwenpaw-working:
  qwenpaw-secret:
  qwenpaw-backups:
  qdm-data:
