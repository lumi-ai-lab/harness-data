name: Publish CLI Container

on:
  workflow_call:
    inputs:
      version_tag:
        description: Container version tag, for example v0.0.2
        required: false
        type: string
      ref:
        description: Git ref to checkout
        required: false
        type: string
      publish:
        description: Publish images to GHCR
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lumi-ai-lab/harness-data-cli
  VERSION_TAG: ${{ inputs.version_tag || github.ref_name }}

jobs:
  build:
    name: Build CLI container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch image
        if: ${{ !inputs.publish && !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:ci-${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/lumi-ai-lab/harness-data
            org.opencontainers.image.description=Data Harness CLI for QDM runtime constraint data

      - name: Publish multi-arch image tag
        if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/lumi-ai-lab/harness-data
            org.opencontainers.image.description=Data Harness CLI for QDM runtime constraint data

      - name: Build linux/amd64 image tag
        if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}-linux-amd64
            ${{ env.IMAGE_NAME }}:latest-linux-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/lumi-ai-lab/harness-data
            org.opencontainers.image.description=Data Harness CLI for QDM runtime constraint data

      - name: Build linux/arm64 image tag
        if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}-linux-arm64
            ${{ env.IMAGE_NAME }}:latest-linux-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/lumi-ai-lab/harness-data
            org.opencontainers.image.description=Data Harness CLI for QDM runtime constraint data
