name: Wiki Release Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wikis-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate private Wikis checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout private Wikis
        uses: actions/checkout@v4
        with:
          repository: lumi-ai-lab/harness-data-wikis
          token: ${{ secrets.WIKIS_CHECKOUT_TOKEN || secrets.RELEASE_GH_TOKEN || github.token }}
          path: wikis-src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Wikis content
        run: |
          set -euo pipefail
          node scripts/verify-pinned-wikis.mjs --wikis-root "$GITHUB_WORKSPACE/wikis-src"
          (cd wikis-src && node "$GITHUB_WORKSPACE/packages/data-harness-cli/src/main.js" wikis check-all)
