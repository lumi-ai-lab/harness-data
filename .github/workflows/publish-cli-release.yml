name: Publish CLI Release

on:
  workflow_call:
    inputs:
      version_tag:
        description: Release tag, for example v0.0.28
        required: false
        type: string
      ref:
        description: Git ref to checkout
        required: false
        type: string
      publish:
        description: Publish GitHub Release assets
        required: false
        default: false
        type: boolean
      verify:
        description: Package and smoke-test a trusted candidate without publishing
        required: false
        default: false
        type: boolean
    secrets:
      RELEASE_GH_TOKEN:
        description: Token with read access to the private qdm-metric-cli release
        required: false
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run full Go test suite with pinned Wikis
        run: go test -count=1 ./cli/...
      - working-directory: npm
        run: npm test -- --test-concurrency=1
      - name: Install pinned Pi runtime
        run: >-
          npm install
          --prefix "${RUNNER_TEMP}/pi-runtime"
          --ignore-scripts
          --no-audit
          --no-fund
          --no-package-lock
          @earendil-works/pi-coding-agent@0.83.0
      - name: Test Pi extension against Pi 0.83.0
        env:
          QDM_PI_RUNTIME_MODULE: ${{ runner.temp }}/pi-runtime/node_modules/@earendil-works/pi-coding-agent/dist/index.js
        run: node --test .agents/pi/extensions/qdm-harness/test/*.test.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-amd64, goos: windows, goarch: amd64, binary: data-harness-cli.exe, archive: zip }
          - { target: linux-amd64, goos: linux, goarch: amd64, binary: data-harness-cli, archive: tar.gz }
          - { target: darwin-amd64, goos: darwin, goarch: amd64, binary: data-harness-cli, archive: tar.gz }
          - { target: darwin-arm64, goos: darwin, goarch: arm64, binary: data-harness-cli, archive: tar.gz }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
          VERSION_TAG: ${{ inputs.version_tag || '' }}
        run: |
          set -euo pipefail
          version="${VERSION_TAG:-v0.0.${GITHUB_RUN_ID}}"
          mkdir -p build dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "build/${BINARY}" ./cli/cmd/data-harness-cli
          metric_binary="qdm-metric-cli"
          if [[ "${GOOS}" == "windows" ]]; then metric_binary="${metric_binary}.exe"; fi
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "build/${metric_binary}" ./cli/cmd/qdm-metric-cli
          asset="data-harness-cli-${version}-${TARGET}.${ARCHIVE}"
          if [[ "${ARCHIVE}" == "zip" ]]; then
            (cd build && zip "../dist/${asset}" "${BINARY}")
          else
            tar -C build -czf "dist/${asset}" "${BINARY}"
          fi
          (cd dist && shasum -a 256 "${asset}" > "${asset}.sha256")
          shasum -a 256 "build/${BINARY}" > "dist/${asset}.binary.sha256"
          metric_asset="qdm-metric-cli-${version}-${TARGET}.${ARCHIVE}"
          if [[ "${ARCHIVE}" == "zip" ]]; then
            (cd build && zip "../dist/${metric_asset}" "${metric_binary}")
          else
            tar -C build -czf "dist/${metric_asset}" "${metric_binary}"
          fi
          (cd dist && shasum -a 256 "${metric_asset}" > "${metric_asset}.sha256")
          shasum -a 256 "build/${metric_binary}" > "dist/${metric_asset}.binary.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-cli-${{ matrix.target }}
          path: dist/*

  release-contract-smoke:
    name: Release contract smoke
    needs:
      - build
      - test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime templates
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Build secretless release fixtures
        env:
          VERSION_TAG: v0.0.${{ github.run_id }}
          QDM_METRIC_VERSION: v0.1.0
        run: |
          set -euo pipefail
          contract_root="/tmp/harness-release-contract-${GITHUB_RUN_ID}"
          approved_wikis="${contract_root}/approved-wikis"
          metric_assets="${contract_root}/qdm-metric-release"
          fake_bin="${contract_root}/bin"
          mkdir -p \
            "${approved_wikis}/metrics" \
            "${approved_wikis}/reports" \
            "${approved_wikis}/dims" \
            "${approved_wikis}/rules" \
            "${metric_assets}" \
            "${fake_bin}" \
            runtime/agents \
            runtime/config \
            runtime/bootstrap
          printf '# Contract Wikis\n' > "${approved_wikis}/index.md"
          printf '# Metrics\n' > "${approved_wikis}/metrics/index.md"
          printf '# Reports\n' > "${approved_wikis}/reports/index.md"
          printf '# Dimensions\n' > "${approved_wikis}/dims/index.md"
          printf '# Rules\n' > "${approved_wikis}/rules/index.md"

          for platform in darwin-arm64 darwin-amd64 linux-amd64 windows-amd64; do
            extension="tar.gz"
            binary="qdm-metric-cli"
            if [[ "${platform}" == windows-* ]]; then
              extension="zip"
              binary="${binary}.exe"
            fi
            asset="qdm-metric-cli-${QDM_METRIC_VERSION}-${platform}.${extension}"
            build_dir="${contract_root}/metric-build-${platform}"
            mkdir -p "${build_dir}"
            cat > "${build_dir}/${binary}" <<'SH'
          #!/bin/sh
          if [ "$#" -eq 1 ] && [ "$1" = "version" ]; then
            printf "qdm-metric-cli v0.1.0-contract\n"
            exit 0
          fi
          exit 64
          SH
            chmod 755 "${build_dir}/${binary}"
            if [[ "${extension}" == "zip" ]]; then
              (cd "${build_dir}" && zip -q "${metric_assets}/${asset}" "${binary}")
            else
              tar -C "${build_dir}" -czf "${metric_assets}/${asset}" "${binary}"
            fi
            sha256sum "${metric_assets}/${asset}" > "${metric_assets}/${asset}.sha256"
            sha256sum "${build_dir}/${binary}" > "${metric_assets}/${asset}.binary.sha256"
          done

          cp -R .agents/pi runtime/agents/pi
          cp config/authz-config-v1.json.example runtime/config/authz-config-v1.json.example
          cp config/harness-config.yaml.example runtime/config/harness-config.yaml.example
          cp config/qdm-cli-paths.env.example runtime/config/qdm-cli-paths.env.example
          cp bootstrap/authz-config-v1.schema.json runtime/bootstrap/authz-config-v1.schema.json
          APPROVED_WIKIS="${approved_wikis}" node --input-type=module <<'NODE'
          import { createApprovedWikisManifest } from "./npm/src/lib/approved-wikis.js";
          createApprovedWikisManifest(
            process.env.APPROVED_WIKIS,
            "/tmp/approved-lumi-wikis-contract-manifest.json"
          );
          NODE
          node bootstrap/materialize-cli-manifest.mjs \
            --manifest bootstrap/cli-manifest.json \
            --output runtime/bootstrap/cli-manifest.json \
            --version "${VERSION_TAG}" \
            --dist dist \
            --qdm-metric-version "${QDM_METRIC_VERSION}" \
            --qdm-metric-dist "${metric_assets}" \
            --approved-wikis-source "${approved_wikis}" \
            --approved-wikis-manifest /tmp/approved-lumi-wikis-contract-manifest.json
          tar -C runtime -czf "dist/harness-data-runtime-${VERSION_TAG}.tar.gz" .
          (
            cd dist
            sha256sum "harness-data-runtime-${VERSION_TAG}.tar.gz" \
              > "harness-data-runtime-${VERSION_TAG}.tar.gz.sha256"
          )

          cat > "${fake_bin}/gh" <<'SH'
          #!/bin/sh
          set -eu
          if [ "${1-}" = "auth" ] && [ "${2-}" = "status" ]; then
            exit 0
          fi
          if [ "${1-}" = "auth" ] && [ "${2-}" = "token" ]; then
            exit 1
          fi
          if [ "${1-}" = "release" ] && [ "${2-}" = "download" ]; then
            pattern=""
            destination=""
            shift 2
            while [ "$#" -gt 0 ]; do
              case "$1" in
                --pattern)
                  pattern="$2"
                  shift 2
                  ;;
                --dir)
                  destination="$2"
                  shift 2
                  ;;
                *)
                  shift
                  ;;
              esac
            done
            test -n "${pattern}"
            test -n "${destination}"
            mkdir -p "${destination}"
            cp "${QDM_METRIC_CONTRACT_ASSETS}/${pattern}" "${destination}/${pattern}"
            exit 0
          fi
          echo "unsupported gh contract invocation: $*" >&2
          exit 2
          SH
          chmod 755 "${fake_bin}/gh"

          {
            echo "CONTRACT_ROOT=${contract_root}"
            echo "CONTRACT_METRIC_ASSETS=${metric_assets}"
            echo "CONTRACT_FAKE_BIN=${fake_bin}"
            echo "CONTRACT_VERSION_TAG=${VERSION_TAG}"
          } >> "$GITHUB_ENV"

      - name: Exercise privileged install and broker authorization
        run: |
          set -euo pipefail
          runtime="${CONTRACT_ROOT}/runtime"
          smoke_assets="${CONTRACT_ROOT}/public-assets"
          mkdir -p "${smoke_assets}"
          cp dist/data-harness-cli-* "${smoke_assets}/"
          cp dist/qdm-metric-cli-* "${smoke_assets}/"
          sudo env \
            "PATH=${CONTRACT_FAKE_BIN}:${PATH}" \
            "HOME=${CONTRACT_ROOT}/home" \
            "QDM_METRIC_CONTRACT_ASSETS=${CONTRACT_METRIC_ASSETS}" \
            node npm/bin/harness-data.js install \
              --dir "${runtime}" \
              --profile pi-requester-authorized \
              --agent pi \
              --yes \
              --runtime-bundle "${PWD}/dist/harness-data-runtime-${CONTRACT_VERSION_TAG}.tar.gz" \
              --runtime-tag "${CONTRACT_VERSION_TAG}" \
              --asset-dir "${smoke_assets}"
          real_metric_path="$(
            sudo node -p "JSON.parse(require('fs').readFileSync('${runtime}/.harness/installer-state.json', 'utf8')).tools['qdm-metric-cli-real'].destination"
          )"
          sudo test -f "${real_metric_path}"
          test "$(sudo stat -c '%a' "${real_metric_path}")" = "500"
          test "$(sudo stat -c '%u' "${real_metric_path}")" = "0"
          test -f /etc/harness-data/approved-metrics-v1.json
          test -f /etc/systemd/system/harness-data-metric-broker.service
          sudo systemd-analyze verify /etc/systemd/system/harness-data-metric-broker.service

          protected_broker_path="/opt/harness-data/broker/qdm-metric-cli"
          test "$(sudo stat -c '%a' "$(dirname "${protected_broker_path}")")" = "700"
          test "$(sudo stat -c '%a' "${protected_broker_path}")" = "500"
          test "$(sudo stat -c '%u' "$(dirname "${protected_broker_path}")")" = "0"
          test "$(sudo stat -c '%u' "${protected_broker_path}")" = "0"
          grep -Fq "ExecStart=\"${protected_broker_path}\" broker-serve" \
            /etc/systemd/system/harness-data-metric-broker.service
          if sudo -u nobody test -r "${real_metric_path}" ||
             sudo -u nobody test -x "${real_metric_path}" ||
             sudo -u nobody "${real_metric_path}" version; then
            echo "::error::Agent UID can read or execute the private qdm-metric-cli"
            exit 1
          fi
          if sudo -u nobody test -r "${protected_broker_path}" ||
             sudo -u nobody test -x "${protected_broker_path}" ||
             sudo -u nobody "${protected_broker_path}" broker-health; then
            echo "::error::Agent UID can read or execute the protected Metric broker"
            exit 1
          fi

          go build -o /tmp/release-smoke-fixture ./cli/tests/cmd/release-smoke-fixture
          reader_gid="$(id -g nobody)"
          sudo /tmp/release-smoke-fixture \
            --runtime "${runtime}" \
            --agent-uid "$(id -u nobody)" \
            --reader-gid "${reader_gid}" |
            tee "${CONTRACT_ROOT}/fixture.json" >/dev/null
          session_id="$(jq -er '.sessionId' "${CONTRACT_ROOT}/fixture.json")"
          authz_config="/etc/harness-data/authz.json"
          control_file="/var/lib/harness-data/release-smoke/control/authz-state.json"
          sudo "${runtime}/bin/data-harness-cli" authz-readiness \
            --config "${authz_config}"
          for protected_file in "${authz_config}" "${control_file}"; do
            test "$(sudo stat -c '%a' "${protected_file}")" = "640"
            test "$(sudo stat -c '%u' "${protected_file}")" = "0"
            test "$(sudo stat -c '%g' "${protected_file}")" = "${reader_gid}"
            if ! sudo -u nobody test -r "${protected_file}" ||
               sudo -u nobody test -w "${protected_file}" ||
               sudo -u daemon test -r "${protected_file}"; then
              echo "::error::authorization control file reader boundary is invalid: ${protected_file}"
              exit 1
            fi
          done
          control_dir="$(dirname "${control_file}")"
          test "$(sudo stat -c '%a' "${control_dir}")" = "710"
          test "$(sudo stat -c '%u' "${control_dir}")" = "0"
          test "$(sudo stat -c '%g' "${control_dir}")" = "${reader_gid}"
          sudo -u nobody "${runtime}/bin/data-harness-cli" authz-bind \
            --config "${authz_config}" \
            --session-id "${session_id}" |
            tee "${CONTRACT_ROOT}/binding.json" >/dev/null
          binding="$(jq -er '.bindingBase64url' "${CONTRACT_ROOT}/binding.json")"
          context_dir="/var/lib/harness-data/release-smoke/requester-context/release-smoke-workspace/pi"
          context_file="$(sudo find "${context_dir}" -maxdepth 1 -type f -name '*.json' -print -quit)"
          if [[ -z "${context_file}" ]] || ! sudo -u nobody test -r "${context_file}"; then
            echo "::error::configured Pi UID cannot read requester context"
            exit 1
          fi
          if sudo -u nobody test -w "${context_file}" || sudo -u nobody test -w "${context_dir}"; then
            echo "::error::configured Pi UID can modify requester context"
            exit 1
          fi
          if sudo -u daemon test -r "${context_file}"; then
            echo "::error::unrelated UID can read requester context"
            exit 1
          fi

          broker_pid=""
          cleanup_broker() {
            if [[ -n "${broker_pid}" ]]; then
              sudo kill "${broker_pid}" >/dev/null 2>&1 || true
              wait "${broker_pid}" >/dev/null 2>&1 || true
            fi
            sudo rm -f /run/harness-data/qdm-metric-cli.sock
          }
          trap cleanup_broker EXIT
          sudo sh -c 'exec "$1" broker-serve >"$2" 2>&1' \
            sh "${protected_broker_path}" "${CONTRACT_ROOT}/broker.log" &
          broker_pid="$!"
          for attempt in {1..50}; do
            if sudo -u nobody "${runtime}/bin/qdm-metric-cli" broker-health; then
              break
            fi
            if [[ "${attempt}" == "50" ]]; then
              cat "${CONTRACT_ROOT}/broker.log"
              echo "::error::trusted Metric broker did not become ready"
              exit 1
            fi
            sleep 0.1
          done

          if sudo -u daemon "${runtime}/bin/qdm-metric-cli" broker-health; then
            echo "::error::unrelated UID can call the Metric broker"
            exit 1
          fi

          set +e
          sudo -u nobody env -u HARNESS_AUTHZ_BINDING_V1 \
            "${runtime}/bin/qdm-metric-cli" version
          wrapper_status="$?"
          set -e
          if [[ "${wrapper_status}" -ne 77 ]]; then
            echo "::error::qdm-metric-cli without deployment authorization must exit 77, got ${wrapper_status}"
            exit 1
          fi
          authorized_output="$(
            sudo -u nobody env "HARNESS_AUTHZ_BINDING_V1=${binding}" \
              "${runtime}/bin/qdm-metric-cli" version
          )"
          test "${authorized_output}" = "qdm-metric-cli v0.1.0-contract"

  release:
    needs:
      - build
      - test
    if: >-
      inputs.publish ||
      inputs.verify ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime templates and pinned Wikis
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Resolve runtime version
        id: runtime
        env:
          VERSION_TAG: ${{ inputs.version_tag || '' }}
        run: |
          set -euo pipefail
          version="${VERSION_TAG:-v0.0.${GITHUB_RUN_ID}}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned qdm-metric-cli release
        id: metric
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          repo="pengmide/qdm-metric-cli"
          version="v0.1.0"
          rm -rf /tmp/qdm-metric-release
          mkdir -p /tmp/qdm-metric-release
          for platform in darwin-arm64 darwin-amd64 linux-amd64 windows-amd64; do
            extension="tar.gz"
            binary="qdm-metric-cli"
            if [[ "${platform}" == windows-* ]]; then
              extension="zip"
              binary="${binary}.exe"
            fi
            asset="qdm-metric-cli-${version}-${platform}.${extension}"
            gh release download "${version}" \
              --repo "${repo}" \
              --pattern "${asset}" \
              --pattern "${asset}.sha256" \
              --dir /tmp/qdm-metric-release
            expected_archive_sha="$(awk '{print $1}' "/tmp/qdm-metric-release/${asset}.sha256")"
            if [[ ! "${expected_archive_sha}" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::qdm-metric-cli archive checksum is invalid: ${asset}.sha256"
              exit 1
            fi
            actual_archive_sha="$(sha256sum "/tmp/qdm-metric-release/${asset}" | awk '{print $1}')"
            if [[ "${actual_archive_sha}" != "${expected_archive_sha}" ]]; then
              echo "::error::qdm-metric-cli archive checksum mismatch: ${asset}"
              exit 1
            fi
            extract_dir="/tmp/qdm-metric-extract-${platform}"
            rm -rf "${extract_dir}"
            mkdir -p "${extract_dir}"
            if [[ "${extension}" == "zip" ]]; then
              unzip -q "/tmp/qdm-metric-release/${asset}" -d "${extract_dir}"
            else
              tar -xzf "/tmp/qdm-metric-release/${asset}" -C "${extract_dir}"
            fi
            test -f "${extract_dir}/${binary}"
            sha256sum "${extract_dir}/${binary}" \
              > "/tmp/qdm-metric-release/${asset}.binary.sha256"
          done
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package immutable runtime bundle
        env:
          VERSION_TAG: ${{ steps.runtime.outputs.version }}
          QDM_METRIC_VERSION: ${{ steps.metric.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p runtime/agents runtime/config runtime/bootstrap
          for agent in claude codex pi openclaw hermes; do
            cp -R ".agents/${agent}" "runtime/agents/${agent}"
          done
          cp config/authz-config-v1.json.example runtime/config/authz-config-v1.json.example
          cp config/harness-config.yaml.example runtime/config/harness-config.yaml.example
          cp config/qdm-cli-paths.env.example runtime/config/qdm-cli-paths.env.example
          cp bootstrap/authz-config-v1.schema.json runtime/bootstrap/authz-config-v1.schema.json
          node --input-type=module <<'NODE'
          import { createApprovedWikisManifest } from "./npm/src/lib/approved-wikis.js";
          createApprovedWikisManifest("wikis", "/tmp/approved-lumi-wikis-manifest.json");
          NODE
          node bootstrap/materialize-cli-manifest.mjs \
            --manifest bootstrap/cli-manifest.json \
            --output runtime/bootstrap/cli-manifest.json \
            --version "${VERSION_TAG}" \
            --dist dist \
            --qdm-metric-version "${QDM_METRIC_VERSION}" \
            --qdm-metric-dist /tmp/qdm-metric-release \
            --approved-wikis-source wikis \
            --approved-wikis-manifest /tmp/approved-lumi-wikis-manifest.json
          for agent in claude codex pi openclaw hermes; do
            ln -s "agents/${agent}" "runtime/.${agent}"
          done
          tar -C runtime -czf "dist/harness-data-runtime-${VERSION_TAG}.tar.gz" .
          (
            cd dist
            shasum -a 256 "harness-data-runtime-${VERSION_TAG}.tar.gz" \
              > "harness-data-runtime-${VERSION_TAG}.tar.gz.sha256"
          )

      - name: Smoke test released installation
        env:
          VERSION_TAG: ${{ steps.runtime.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          smoke_root="/tmp/harness-release-smoke-${GITHUB_RUN_ID}"
          smoke_assets="${smoke_root}/assets"
          mkdir -p "${smoke_assets}"
          cp dist/data-harness-cli-* "${smoke_assets}/"
          cp dist/qdm-metric-cli-* "${smoke_assets}/"
          runtime="${smoke_root}/runtime"
          sudo env "PATH=${PATH}" "HOME=${smoke_root}/home" \
            node npm/bin/harness-data.js install \
              --dir "${runtime}" \
              --profile pi-requester-authorized \
              --agent pi \
              --yes \
              --github-token "${GH_TOKEN}" \
              --runtime-bundle "${PWD}/dist/harness-data-runtime-${VERSION_TAG}.tar.gz" \
              --runtime-tag "${VERSION_TAG}" \
              --asset-dir "${smoke_assets}"
          real_metric_path="$(
            sudo node -p "JSON.parse(require('fs').readFileSync('${runtime}/.harness/installer-state.json', 'utf8')).tools['qdm-metric-cli-real'].destination"
          )"
          test "$(sudo stat -c '%a' "$(dirname "${real_metric_path}")")" = "700"
          test "$(sudo stat -c '%a' "${real_metric_path}")" = "500"
          test "$(sudo stat -c '%u' "$(dirname "${real_metric_path}")")" = "0"
          test "$(sudo stat -c '%u' "${real_metric_path}")" = "0"
          test -f /etc/systemd/system/harness-data-metric-broker.service
          protected_broker_path="/opt/harness-data/broker/qdm-metric-cli"
          test "$(sudo stat -c '%a' "$(dirname "${protected_broker_path}")")" = "700"
          test "$(sudo stat -c '%a' "${protected_broker_path}")" = "500"
          test "$(sudo stat -c '%u' "$(dirname "${protected_broker_path}")")" = "0"
          test "$(sudo stat -c '%u' "${protected_broker_path}")" = "0"
          grep -Fq "ExecStart=\"${protected_broker_path}\" broker-serve" \
            /etc/systemd/system/harness-data-metric-broker.service
          sudo systemd-analyze verify /etc/systemd/system/harness-data-metric-broker.service
          if sudo -u nobody test -r "${real_metric_path}" ||
             sudo -u nobody test -x "${real_metric_path}" ||
             sudo -u nobody "${real_metric_path}" version; then
            echo "::error::Agent UID can read or execute the private qdm-metric-cli"
            exit 1
          fi
          if sudo -u nobody test -r "${protected_broker_path}" ||
             sudo -u nobody test -x "${protected_broker_path}" ||
             sudo -u nobody "${protected_broker_path}" broker-health; then
            echo "::error::Agent UID can read or execute the protected Metric broker"
            exit 1
          fi

          go build -o /tmp/release-smoke-fixture ./cli/tests/cmd/release-smoke-fixture
          reader_gid="$(id -g nobody)"
          sudo /tmp/release-smoke-fixture \
            --runtime "${runtime}" \
            --agent-uid "$(id -u nobody)" \
            --reader-gid "${reader_gid}" |
            tee "${smoke_root}/fixture.json" >/dev/null
          session_id="$(jq -er '.sessionId' "${smoke_root}/fixture.json")"
          authz_config="/etc/harness-data/authz.json"
          control_file="/var/lib/harness-data/release-smoke/control/authz-state.json"
          sudo "${runtime}/bin/data-harness-cli" authz-readiness \
            --config "${authz_config}"
          for protected_file in "${authz_config}" "${control_file}"; do
            test "$(sudo stat -c '%a' "${protected_file}")" = "640"
            test "$(sudo stat -c '%u' "${protected_file}")" = "0"
            test "$(sudo stat -c '%g' "${protected_file}")" = "${reader_gid}"
            if ! sudo -u nobody test -r "${protected_file}" ||
               sudo -u nobody test -w "${protected_file}" ||
               sudo -u daemon test -r "${protected_file}"; then
              echo "::error::authorization control file reader boundary is invalid: ${protected_file}"
              exit 1
            fi
          done
          control_dir="$(dirname "${control_file}")"
          test "$(sudo stat -c '%a' "${control_dir}")" = "710"
          test "$(sudo stat -c '%u' "${control_dir}")" = "0"
          test "$(sudo stat -c '%g' "${control_dir}")" = "${reader_gid}"
          sudo -u nobody "${runtime}/bin/data-harness-cli" authz-bind \
            --config "${authz_config}" \
            --session-id "${session_id}" |
            tee "${smoke_root}/binding.json" >/dev/null
          binding="$(jq -er '.bindingBase64url' "${smoke_root}/binding.json")"
          context_dir="/var/lib/harness-data/release-smoke/requester-context/release-smoke-workspace/pi"
          context_file="$(sudo find "${context_dir}" -maxdepth 1 -type f -name '*.json' -print -quit)"
          if [[ -z "${context_file}" ]] || ! sudo -u nobody test -r "${context_file}"; then
            echo "::error::configured Pi UID cannot read requester context"
            exit 1
          fi
          if sudo -u nobody test -w "${context_file}" || sudo -u nobody test -w "${context_dir}"; then
            echo "::error::configured Pi UID can modify requester context"
            exit 1
          fi
          if sudo -u daemon test -r "${context_file}"; then
            echo "::error::unrelated UID can read requester context"
            exit 1
          fi

          broker_pid=""
          cleanup_broker() {
            if [[ -n "${broker_pid}" ]]; then
              sudo kill "${broker_pid}" >/dev/null 2>&1 || true
              wait "${broker_pid}" >/dev/null 2>&1 || true
            fi
            sudo rm -f /run/harness-data/qdm-metric-cli.sock
          }
          trap cleanup_broker EXIT
          sudo sh -c 'exec "$1" broker-serve >"$2" 2>&1' \
            sh "${protected_broker_path}" "${smoke_root}/broker.log" &
          broker_pid="$!"
          for attempt in {1..50}; do
            if sudo -u nobody "${runtime}/bin/qdm-metric-cli" broker-health; then
              break
            fi
            if [[ "${attempt}" == "50" ]]; then
              cat "${smoke_root}/broker.log"
              echo "::error::trusted Metric broker did not become ready"
              exit 1
            fi
            sleep 0.1
          done

          if sudo -u daemon "${runtime}/bin/qdm-metric-cli" broker-health; then
            echo "::error::unrelated UID can call the Metric broker"
            exit 1
          fi

          set +e
          sudo -u nobody env -u HARNESS_AUTHZ_BINDING_V1 \
            "${runtime}/bin/qdm-metric-cli" version
          wrapper_status="$?"
          set -e
          if [[ "${wrapper_status}" -ne 77 ]]; then
            echo "::error::qdm-metric-cli without deployment authorization must exit 77, got ${wrapper_status}"
            exit 1
          fi
          authorized_output="$(
            sudo -u nobody env "HARNESS_AUTHZ_BINDING_V1=${binding}" \
              "${runtime}/bin/qdm-metric-cli" version
          )"
          test -n "${authorized_output}"
      - name: Publish GitHub Release assets
        if: inputs.publish || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.runtime.outputs.version }}
          files: dist/*
          generate_release_notes: true
