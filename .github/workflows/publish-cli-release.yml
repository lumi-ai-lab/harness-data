name: Publish CLI Release

on:
  workflow_call:
    inputs:
      version_tag:
        description: Release tag, for example v0.0.2
        required: false
        type: string
      ref:
        description: Git ref to checkout
        required: false
        type: string
      publish:
        description: Publish GitHub Release assets
        required: false
        default: false
        type: boolean
    secrets:
      RELEASE_ARCHIVE_PASSWORD:
        required: false
      RELEASE_GH_TOKEN:
        required: false
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: inputs.publish || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout runtime templates
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          submodules: recursive
          clean: false

      - name: Package runtime bundle
        env:
          VERSION_TAG: ${{ inputs.version_tag || github.ref_name }}
          RELEASE_ARCHIVE_PASSWORD: ${{ secrets.RELEASE_ARCHIVE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          node scripts/verify-pinned-wikis.mjs
          ./bin/data-harness-cli wikis check-all
          ./bin/data-harness-cli wikis build-index
          node scripts/verify-wikis-relocation.mjs
          scripts/build-runtime-artifact.sh --output-dir runtime --version "$VERSION_TAG"
          test -n "${RELEASE_ARCHIVE_PASSWORD}" || { echo "::error::RELEASE_ARCHIVE_PASSWORD is required for production releases"; exit 1; }
          runtime_asset="dist/harness-data-runtime-${VERSION_TAG}.zip"
          (cd runtime && zip -q -r -P "${RELEASE_ARCHIVE_PASSWORD}" "../${runtime_asset}" .)
          unzip -P "${RELEASE_ARCHIVE_PASSWORD}" -t "${runtime_asset}" >/dev/null
          if unzip -P "${RELEASE_ARCHIVE_PASSWORD}-wrong" -t "${runtime_asset}" >/dev/null 2>&1; then
            echo "::error::runtime archive accepted an incorrect password"
            exit 1
          fi
          if unzip -P "${RELEASE_ARCHIVE_PASSWORD}-wrong" -p "${runtime_asset}" bootstrap/cli-manifest.json | cmp -s - runtime/bootstrap/cli-manifest.json; then
            echo "::error::runtime archive accepted an incorrect password"
            exit 1
          fi
          runtime_verify_stage="$(mktemp -d)"
          unzip -P "$RELEASE_ARCHIVE_PASSWORD" -q "$runtime_asset" -d "$runtime_verify_stage"
          node scripts/verify-artifact.mjs "$runtime_verify_stage" --kind runtime
          rm -rf "$runtime_verify_stage"
          wikis_stage="$(mktemp -d)"
          trap 'rm -rf "$wikis_stage"' EXIT
          git -C wikis archive HEAD | tar -x -C "$wikis_stage"
          test -f "$wikis_stage/index.md"
          for dir in metrics reports dims rules; do
            test -d "$wikis_stage/$dir"
          done
          wikis_asset="dist/harness-data-wikis-${VERSION_TAG}.zip"
          (cd "$wikis_stage" && zip -q -r -P "${RELEASE_ARCHIVE_PASSWORD}" "${GITHUB_WORKSPACE}/$wikis_asset" .)
          unzip -P "${RELEASE_ARCHIVE_PASSWORD}" -t "$wikis_asset" >/dev/null
          if unzip -P "${RELEASE_ARCHIVE_PASSWORD}-wrong" -t "$wikis_asset" >/dev/null 2>&1; then
            echo "::error::Wikis archive accepted an incorrect password"
            exit 1
          fi
          if unzip -P "${RELEASE_ARCHIVE_PASSWORD}-wrong" -p "$wikis_asset" index.md | cmp -s - "$wikis_stage/index.md"; then
            echo "::error::Wikis archive accepted an incorrect password"
            exit 1
          fi
          if unzip -Z1 "$wikis_asset" | grep -Eq '(^|/)\.git(/|$)'; then
            echo "::error::Wikis archive must not contain Git metadata"
            exit 1
          fi
          if find dist -type f -name '*.sha256' -print -quit | grep -q .; then
            echo "::error::dist must not contain .sha256 assets"
            exit 1
          fi
          test -f "dist/harness-data-runtime-${VERSION_TAG}.zip"
          test -f "dist/harness-data-wikis-${VERSION_TAG}.zip"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag || github.ref_name }}
          overwrite_files: true
          files: |
            dist/*
          generate_release_notes: true
