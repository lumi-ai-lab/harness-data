name: Publish npm installer

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the npm package
        required: false
        default: false
        type: boolean
      ref:
        description: Git ref to checkout
        required: false
        type: string
    secrets:
      NPM_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the npm package
        required: false
        default: true
        type: boolean
      ref:
        description: Git ref to checkout
        required: false
        default: master
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm install

      - name: Test
        run: npm test -- --test-concurrency=1

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish
        if: inputs.publish || startsWith(github.ref, 'refs/tags/')
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
