name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.0.27
        required: true
        type: string
      publish_npm:
        description: Publish npm package; disable when retrying after npm already succeeded
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.vars.outputs.version_tag }}
      version: ${{ steps.vars.outputs.version }}

    steps:
      - name: Resolve release tag
        id: vars
        env:
          VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::release tag must match vMAJOR.MINOR.PATCH: ${VERSION_TAG}"
            exit 1
          fi
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.version_tag }}
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          submodules: recursive
          fetch-depth: 0

      - name: Validate immutable release metadata
        env:
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "${VERSION_TAG}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "::error::checkout does not match ${VERSION_TAG}: ${head_commit} != ${tag_commit}"
            exit 1
          fi

          package_version="$(node -p 'JSON.parse(require("fs").readFileSync("npm/package.json", "utf8")).version')"
          if [[ "${package_version}" != "${VERSION}" ]]; then
            echo "::error::npm/package.json version ${package_version} does not match tag ${VERSION_TAG}"
            exit 1
          fi

          workbuddy_version="$(node -p 'JSON.parse(require("fs").readFileSync(".agents/workbuddy/.codebuddy-plugin/plugin.json", "utf8")).version')"
          if [[ "${workbuddy_version}" != "${VERSION}" ]]; then
            echo "::error::WorkBuddy plugin version ${workbuddy_version} does not match tag ${VERSION_TAG}"
            exit 1
          fi

          workbuddy_marketplace_version="$(node -p 'JSON.parse(require("fs").readFileSync(".agents/.codebuddy-plugin/marketplace.json", "utf8")).plugins.find((plugin) => plugin.name === "qdm-harness").version')"
          if [[ "${workbuddy_marketplace_version}" != "${VERSION}" ]]; then
            echo "::error::WorkBuddy marketplace version ${workbuddy_marketplace_version} does not match tag ${VERSION_TAG}"
            exit 1
          fi

          test -n "$(git ls-tree HEAD wikis | awk '{print $3}')"
          test "$(git -C wikis rev-parse HEAD)" = "$(git ls-tree HEAD wikis | awk '{print $3}')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test npm installer
        working-directory: npm
        run: |
          npm install
          npm test -- --test-concurrency=1
          npm pack --dry-run

      - name: Test JS data-harness-cli
        working-directory: packages/data-harness-cli
        run: node --test

      - name: Build Wikis index from pinned submodule
        run: |
          chmod +x bin/data-harness-cli
          ./bin/data-harness-cli wikis build-index --skip-checks
          test -s .harness/index/wikis-index.json
          test -s .harness/index/wikis-runtime-index.json
          test -s resource-manifest.json

      - name: Verify external CLI assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          RELEASE_ARCHIVE_PASSWORD: ${{ secrets.RELEASE_ARCHIVE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_ARCHIVE_PASSWORD}" || { echo "::error::RELEASE_ARCHIVE_PASSWORD is required for production releases"; exit 1; }
          node <<'NODE' > /tmp/external-assets.tsv
          const fs = require("fs");
          const childProcess = require("child_process");
          const manifest = JSON.parse(fs.readFileSync("bootstrap/cli-manifest.json", "utf8"));
          for (const tool of manifest.tools || []) {
            if (tool.name === "data-harness-cli") continue;
            const release = childProcess.execFileSync(
              "gh",
              ["release", "view", "--repo", tool.repo, "--json", "tagName", "--jq", ".tagName"],
              { encoding: "utf8" }
            ).trim();
            for (const platform of Object.keys(tool.platforms || {})) {
              const name = `${tool.binary}-${release}-${platform}.zip`;
              console.log(`${tool.repo}\t${release}\t${name}`);
            }
          }
          NODE
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          while IFS=$'\t' read -r repo tag asset; do
            echo "checking ${repo} ${tag} ${asset}"
            gh release view "$tag" --repo "$repo" --json assets \
              --jq '.assets[].name' | grep -Fx "$asset" >/dev/null
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$tmp"
            unzip -P "${RELEASE_ARCHIVE_PASSWORD}" -t "${tmp}/${asset}" >/dev/null
            if unzip -P "${RELEASE_ARCHIVE_PASSWORD}-wrong" -t "${tmp}/${asset}" >/dev/null 2>&1; then
              echo "::error::external archive accepted an incorrect password: ${asset}"
              exit 1
            fi
          done < /tmp/external-assets.tsv

  cli-release:
    name: Publish CLI release assets
    needs: validate
    uses: ./.github/workflows/publish-cli-release.yml
    with:
      publish: true
      version_tag: ${{ needs.validate.outputs.version_tag }}
      ref: ${{ needs.validate.outputs.version_tag }}
    secrets:
      RELEASE_ARCHIVE_PASSWORD: ${{ secrets.RELEASE_ARCHIVE_PASSWORD }}
      RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}

  cli-container:
    name: Publish CLI container
    needs: validate
    uses: ./.github/workflows/publish-cli-container.yml
    with:
      publish: true
      version_tag: ${{ needs.validate.outputs.version_tag }}
      ref: ${{ needs.validate.outputs.version_tag }}

  verify-release-assets:
    name: Verify release assets
    needs:
      - validate
      - cli-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.version_tag }}

      - name: Verify runtime and Wikis bundle assets
        env:
          VERSION_TAG: ${{ needs.validate.outputs.version_tag }}
        run: |
          set -euo pipefail
          for asset in \
            "harness-data-runtime-${VERSION_TAG}.zip" \
            "harness-data-wikis-${VERSION_TAG}.zip"; do
            base="https://github.com/lumi-ai-lab/harness-data/releases/download/${VERSION_TAG}/${asset}"
            curl -fsIL --retry 5 --retry-delay 3 "$base" >/dev/null
          done

  npm:
    name: Publish npm installer
    needs:
      - validate
      - cli-container
      - verify-release-assets
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_npm }}
    uses: ./.github/workflows/publish-npm.yml
    with:
      publish: true
      ref: ${{ needs.validate.outputs.version_tag }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke:
    name: Verify npm release
    needs:
      - validate
      - npm
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify published package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if npm view "@lumi-ai-lab/harness-data@${VERSION}" version \
                --registry=https://registry.npmjs.org/ --prefer-online | grep -Fx "${VERSION}" >/dev/null; then
              break
            fi
            if [[ "$i" == "20" ]]; then
              echo "published npm package did not become available in time" >&2
              exit 1
            fi
            sleep 15
          done
          npm access get status @lumi-ai-lab/harness-data --registry=https://registry.npmjs.org/ | grep -E ': public$' >/dev/null
          npm dist-tag ls @lumi-ai-lab/harness-data --registry=https://registry.npmjs.org/ | grep -Fx "latest: ${VERSION}" >/dev/null
          npm_config_registry=https://registry.npmjs.org/ npx -y "@lumi-ai-lab/harness-data@${VERSION}" version
