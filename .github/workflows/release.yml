name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.0.27
        required: true
        type: string
      publish_npm:
        description: Publish npm package; disable when retrying after npm already succeeded
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.vars.outputs.version_tag }}
      version: ${{ steps.vars.outputs.version }}

    steps:
      - name: Resolve release tag
        id: vars
        env:
          VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::release tag must match vMAJOR.MINOR.PATCH: ${VERSION_TAG}"
            exit 1
          fi
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.version_tag }}
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          submodules: recursive
          fetch-depth: 0

      - name: Validate immutable release metadata
        env:
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "${VERSION_TAG}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "::error::checkout does not match ${VERSION_TAG}: ${head_commit} != ${tag_commit}"
            exit 1
          fi

          package_version="$(node -p 'JSON.parse(require("fs").readFileSync("npm/package.json", "utf8")).version')"
          if [[ "${package_version}" != "${VERSION}" ]]; then
            echo "::error::npm/package.json version ${package_version} does not match tag ${VERSION_TAG}"
            exit 1
          fi

          test -n "$(git ls-tree HEAD wikis | awk '{print $3}')"
          test "$(git -C wikis rev-parse HEAD)" = "$(git ls-tree HEAD wikis | awk '{print $3}')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate business-approved Lumi Wikis
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            createApprovedWikisManifest,
            verifyApprovedWikisSource
          } from "./npm/src/lib/approved-wikis.js";

          const manifest = "/tmp/approved-lumi-wikis-manifest.json";
          const generated = createApprovedWikisManifest("wikis", manifest);
          verifyApprovedWikisSource("wikis", manifest, generated.manifestSha256);
          NODE

      - name: Test npm installer
        working-directory: npm
        run: |
          npm install
          npm test -- --test-concurrency=1
          npm pack --dry-run

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Build Wikis index from pinned submodule
        working-directory: cli
        run: |
          go run ./cmd/data-harness-cli wikis build-index --skip-checks
          test -s ../.harness/index/wikis-index.json
          test -s ../.harness/index/wikis-runtime-index.json

      - name: Test Go CLI
        working-directory: cli
        run: go test -count=1 ./...

      - name: Verify external CLI assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/external-assets.tsv
          const fs = require("fs");
          const childProcess = require("child_process");
          const manifest = JSON.parse(fs.readFileSync("bootstrap/cli-manifest.json", "utf8"));
          function archiveSuffix(asset, platform) {
            if (asset.archive) return asset.archive;
            if (asset.url?.endsWith(".tar.gz")) return "tar.gz";
            if (asset.url?.endsWith(".zip")) return "zip";
            return platform.startsWith("windows-") ? "zip" : "tar.gz";
          }
          for (const tool of manifest.tools || []) {
            if (tool.repo === "lumi-ai-lab/harness-data") continue;
            const release = tool.tracking === "fixed"
              ? String(tool.version || "").trim()
              : childProcess.execFileSync(
                  "gh",
                  ["release", "view", "--repo", tool.repo, "--json", "tagName", "--jq", ".tagName"],
                  { encoding: "utf8" }
                ).trim();
            if (!release) throw new Error(`manifest fixed tool ${tool.name} has no version`);
            for (const [platform, asset] of Object.entries(tool.platforms || {})) {
              const name = `${tool.binary}-${release}-${platform}.${archiveSuffix(asset, platform)}`;
              console.log(`${tool.repo}\t${release}\t${name}`);
              console.log(`${tool.repo}\t${release}\t${name}.sha256`);
              console.log(`${tool.repo}\t${release}\t${name}.binary.sha256`);
            }
          }
          NODE
          while IFS=$'\t' read -r repo tag asset; do
            echo "checking ${repo} ${tag} ${asset}"
            gh release view "$tag" --repo "$repo" --json assets \
              --jq '.assets[].name' | grep -Fx "$asset" >/dev/null
          done < /tmp/external-assets.tsv

  cli-release:
    name: Publish CLI release assets
    needs: validate
    uses: ./.github/workflows/publish-cli-release.yml
    with:
      publish: true
      version_tag: ${{ needs.validate.outputs.version_tag }}
      ref: ${{ needs.validate.outputs.version_tag }}
    secrets:
      RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}

  cli-container:
    name: Publish CLI container
    needs:
      - validate
      - cli-release
    uses: ./.github/workflows/publish-cli-container.yml
    with:
      publish: true
      version_tag: ${{ needs.validate.outputs.version_tag }}
      ref: ${{ needs.validate.outputs.version_tag }}

  verify-release-assets:
    name: Verify release assets
    needs:
      - validate
      - cli-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.version_tag }}

      - name: Verify Harness-owned CLI assets
        env:
          VERSION_TAG: ${{ needs.validate.outputs.version_tag }}
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/data-harness-assets.txt
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("bootstrap/cli-manifest.json", "utf8"));
          const tools = manifest.tools.filter((item) => item.repo === "lumi-ai-lab/harness-data");
          if (!tools.some((item) => item.name === "data-harness-cli")) throw new Error("manifest missing data-harness-cli");
          function archiveSuffix(asset, platform) {
            if (asset.archive) return asset.archive;
            if (asset.url?.endsWith(".tar.gz")) return "tar.gz";
            if (asset.url?.endsWith(".zip")) return "zip";
            return platform.startsWith("windows-") ? "zip" : "tar.gz";
          }
          for (const tool of tools) {
            for (const [platform, asset] of Object.entries(tool.platforms || {})) {
              const name = `${tool.binary}-${process.env.VERSION_TAG}-${platform}.${archiveSuffix(asset, platform)}`;
              const url = `https://github.com/${tool.repo}/releases/download/${process.env.VERSION_TAG}/${name}`;
              console.log(url);
              console.log(`${url}.sha256`);
              console.log(`${url}.binary.sha256`);
            }
          }
          NODE
          while IFS= read -r url; do
            echo "checking $url"
            curl -fsIL --retry 5 --retry-delay 3 "$url" >/dev/null
          done < /tmp/data-harness-assets.txt

      - name: Verify runtime bundle assets
        env:
          VERSION_TAG: ${{ needs.validate.outputs.version_tag }}
        run: |
          set -euo pipefail
          base="https://github.com/lumi-ai-lab/harness-data/releases/download/${VERSION_TAG}/harness-data-runtime-${VERSION_TAG}.tar.gz"
          curl -fsIL --retry 5 --retry-delay 3 "$base" >/dev/null
          curl -fsIL --retry 5 --retry-delay 3 "${base}.sha256" >/dev/null

  npm:
    name: Publish npm installer
    needs:
      - validate
      - cli-container
      - verify-release-assets
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_npm }}
    uses: ./.github/workflows/publish-npm.yml
    with:
      publish: true
      ref: ${{ needs.validate.outputs.version_tag }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke:
    name: Verify npm release
    needs:
      - validate
      - npm
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify published package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if npm view "@lumi-ai-lab/harness-data@${VERSION}" version \
                --registry=https://registry.npmjs.org/ --prefer-online | grep -Fx "${VERSION}" >/dev/null; then
              break
            fi
            if [[ "$i" == "20" ]]; then
              echo "published npm package did not become available in time" >&2
              exit 1
            fi
            sleep 15
          done
          npm access get status @lumi-ai-lab/harness-data --registry=https://registry.npmjs.org/ | grep -E ': public$' >/dev/null
          npm dist-tag ls @lumi-ai-lab/harness-data --registry=https://registry.npmjs.org/ | grep -Fx "latest: ${VERSION}" >/dev/null
          npm_config_registry=https://registry.npmjs.org/ npx -y "@lumi-ai-lab/harness-data@${VERSION}" version
