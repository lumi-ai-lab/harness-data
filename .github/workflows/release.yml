name: Codex Plugin Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish, for example v0.0.55
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: codex-plugin-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Codex Marketplace ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: vars
        env:
          VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::release tag must match vMAJOR.MINOR.PATCH: ${VERSION_TAG}"
            exit 1
          fi
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.version_tag }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Marketplace and Plugin metadata
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const marketplace = JSON.parse(fs.readFileSync(".agents/plugins/marketplace.json", "utf8"));
          if (marketplace.name !== "lumi-ai-lab") throw new Error(`unexpected Marketplace name: ${marketplace.name}`);
          const entry = (marketplace.plugins || []).find((item) => item?.name === "harness-data");
          if (!entry || entry.source?.path !== "./plugins/harness-data") {
            throw new Error("Marketplace must expose ./plugins/harness-data as harness-data");
          }
          const plugin = JSON.parse(fs.readFileSync("plugins/harness-data/.codex-plugin/plugin.json", "utf8"));
          if (plugin.name !== "harness-data") throw new Error(`unexpected Plugin name: ${plugin.name}`);
          if (plugin.version !== version) throw new Error(`Plugin version ${plugin.version} does not match tag ${version}`);
          const installer = JSON.parse(fs.readFileSync("npm/package.json", "utf8"));
          if (installer.version !== version) throw new Error(`bundled installer version ${installer.version} does not match tag ${version}`);
          if (fs.existsSync(".gitmodules")) throw new Error("Wiki submodules are not part of the Plugin release");
          if (fs.existsSync("wikis")) throw new Error("top-level Wiki checkout is not part of the Plugin release");
          NODE

      - name: Build Plugin bundle
        run: node plugins/harness-data/scripts/bundle-dist.mjs --output-dir plugins/harness-data/dist

      - name: Pack Codex Marketplace ZIP
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          node scripts/build-codex-marketplace.mjs pack \
            --zip "$GITHUB_WORKSPACE/dist/harness-data-codex-marketplace-${VERSION_TAG}.zip" \
            --version "$VERSION"
          unzip -l "$GITHUB_WORKSPACE/dist/harness-data-codex-marketplace-${VERSION_TAG}.zip" | grep -q 'harness-data-codex-marketplace/.agents/plugins/marketplace.json'
          if unzip -Z1 "$GITHUB_WORKSPACE/dist/harness-data-codex-marketplace-${VERSION_TAG}.zip" | grep -Eq 'resources/wikis'; then
            echo "::error::Marketplace ZIP must not contain private Wikis"
            exit 1
          fi

      - name: Checkout private Wikis
        uses: actions/checkout@v4
        with:
          repository: lumi-ai-lab/harness-data-wikis
          token: ${{ secrets.WIKIS_CHECKOUT_TOKEN || secrets.RELEASE_GH_TOKEN || github.token }}
          path: wikis-src

      - name: Pack encrypted Wikis ZIP
        env:
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
          RELEASE_ARCHIVE_PASSWORD: ${{ secrets.RELEASE_ARCHIVE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_ARCHIVE_PASSWORD}" || { echo "::error::RELEASE_ARCHIVE_PASSWORD is required"; exit 1; }
          test -f wikis-src/index.md
          for dir in metrics reports dims rules; do
            test -d "wikis-src/$dir"
          done
          wikis_asset="dist/harness-data-wikis-${VERSION_TAG}.zip"
          rm -rf wikis-src/.git
          (cd wikis-src && zip -q -r -P "${RELEASE_ARCHIVE_PASSWORD}" "${GITHUB_WORKSPACE}/${wikis_asset}" .)
          unzip -P "${RELEASE_ARCHIVE_PASSWORD}" -t "${wikis_asset}" >/dev/null
          if unzip -Z1 "${wikis_asset}" | grep -Eq '(^|/)\.git(/|$)'; then
            echo "::error::Wikis ZIP must not include .git"
            exit 1
          fi

      - name: Run core tests
        run: |
          set -euo pipefail
          npm --prefix npm test -- --test-concurrency=1
          node --test packages/data-harness-cli/test/*.test.js
          node --test packages/harness-runtime-node/src/*.test.mjs
          node --test plugins/harness-data/mcp/server.test.mjs
          node --test plugins/harness-data/test/clean-room-setup.test.mjs
          node --test scripts/build-codex-marketplace.test.mjs
          node --test scripts/build-qwenpaw-plugin.test.mjs

      - name: Build QwenPaw Plugin ZIP
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/build-qwenpaw-plugin.mjs --output-dir "$GITHUB_WORKSPACE/dist" --version "$VERSION"

      - name: Verify QwenPaw Plugin ZIP
        env:
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
        run: |
          set -euo pipefail
          asset="dist/harness-data-qwenpaw-plugin-${VERSION_TAG}.zip"
          unzip -Z1 "$asset" | grep -q '^plugin.json$'
          if unzip -Z1 "$asset" | grep -Eq '(^|/)(wikis|resources|tests|__pycache__|\.harness)/'; then
            echo "::error::QwenPaw Plugin ZIP must not contain wiki/secret/state/test content"
            exit 1
          fi
          unzip -p "$asset" plugin-manifest.json | grep -q '"host": "qwenpaw"'

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release create "$VERSION_TAG" --title "$VERSION_TAG" --notes "Codex + QwenPaw Plugin ${VERSION_TAG}"
          fi
          gh release upload "$VERSION_TAG" \
            "dist/harness-data-codex-marketplace-${VERSION_TAG}.zip" \
            "dist/harness-data-qwenpaw-plugin-${VERSION_TAG}.zip" \
            "dist/harness-data-wikis-${VERSION_TAG}.zip" \
            --clobber
